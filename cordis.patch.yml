# dsh-shell-switch — one flag to choose the shell stack on Windows.
#
# The shipped base bundle gates the two shell stacks purely by platform:
#   bash-sandbox / tool-bash  -> disabled: !!js process.platform === 'win32'
#   pwsh-sandbox / tool-pwsh  -> disabled: !!js process.platform !== 'win32'
# so a Windows host always gets PowerShell and can never reach bash through
# configuration alone.
#
# This patch overrides all four rows with an env-driven expression instead.
# Because the switch must flip BOTH rows of each stack at once, both members
# of a stack read the same expression: a partial switch makes the profile fail
# to load.
#
# Usage — set one environment variable before launching DeepSeek Harness:
#   DSH_SHELL=bash        (default) Bash executor + bash tool
#   DSH_SHELL=powershell  PowerShell executor + pwsh tool
# Values are case-insensitive; `pwsh` is accepted as an alias.

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js (process.env.DSH_SHELL ?? 'bash').toLowerCase() === 'bash'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js (process.env.DSH_SHELL ?? 'bash').toLowerCase() === 'bash'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js (process.env.DSH_SHELL ?? 'bash').toLowerCase() !== 'bash'
  config:
    timeoutMs: 120000
    maxTimeoutMs: 600000

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js (process.env.DSH_SHELL ?? 'bash').toLowerCase() !== 'bash'
